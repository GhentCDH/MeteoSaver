[project]
name = "meteosaver"
version = "1.0.0"
description = "Machine-learning based software for the transcription of historical weather data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cartopy>=0.22",
    "easyocr>=1.7.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-python-headless>=4.6",
    "openpyxl>=3.1.2",
    # pandas 3 no longer accepts the 'M' frequency used in the data formatting module
    "pandas>=2.2,<3",
    "pillow>=10",
    "pytesseract>=0.3.13",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    # GLM-OCR
    "textual>=8.2.8",
    "textualeffects>=0.2.0",
    "torch>=2.10",
    "transformers>=5.3",
]

[project.scripts]
meteosaver = "tui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Only what the dashboard imports is installed, as an editable install: src/ stays the live code.
# The pipeline scripts (main.py and its modules) are still started by the dashboard from src/.
# (hatchling rather than setuptools: the empty setup.py in the project root would otherwise be run instead of this file)
[tool.hatch.build.targets.wheel]
sources = ["src"]
include = ["src/tui.py", "src/image_discovery.py", "src/meteosaver_app"]
dev-mode-dirs = ["src"]
