[project]
name = "meteosaver"
version = "1.0.0"
description = "Machine-learning based software for the transcription of historical weather data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cartopy>=0.22",
    "easyocr>=1.7.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    # opencv-contrib-python: a superset of opencv-python(-headless), with the GUI that taulu needs to annotate the header of the table
    "opencv-contrib-python>=4.13",
    "openpyxl>=3.1.2",
    # pandas 3 no longer accepts the 'M' frequency used in the data formatting module
    "pandas>=2.2,<3",
    "pillow>=10",
    "pytesseract>=0.3.13",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    # taulu: cell detection on the grid of the table (cell_detection_engine = taulu in configuration.ini)
    "taulu>=3.0.2",
    # GLM-OCR
    "textual>=8.2.8",
    "textualeffects>=0.2.0",
    "torch>=2.10",
    "transformers>=5.3",
]

[project.scripts]
meteosaver = "tui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Only what the dashboard imports is installed, as an editable install: src/ stays the live code.
# The pipeline scripts (main.py and its modules) are still started by the dashboard from src/.
# (hatchling rather than setuptools: the empty setup.py in the project root would otherwise be run instead of this file)
[tool.hatch.build.targets.wheel]
sources = ["src"]
include = ["src/tui.py", "src/image_discovery.py", "src/meteosaver_app"]
dev-mode-dirs = ["src"]
[tool.uv]
# The scripts in src/ are run directly; there is no package to build or install
package = false
# Only one OpenCV package can be installed in an environment (they all provide cv2 and overwrite each other).
# taulu and easyocr ask for opencv-python and opencv-python-headless; opencv-contrib-python above replaces both
override-dependencies = [
    "opencv-python; sys_platform == 'never'",
    "opencv-python-headless; sys_platform == 'never'",
]
